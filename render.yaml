services:
  - type: web
    name: spendsense-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://narasimharao590.github.io
      - key: MONGODB_URI
        sync: false
